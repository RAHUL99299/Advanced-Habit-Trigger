# Application Properties
# ========================
# Database Configuration (Supports MySQL and Supabase PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/habit_trigger_analyzer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rahul@7340}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Disable automatic data.sql script execution on startup
spring.sql.init.mode=never

# Hikari Connection Pool Settings (For Supabase Cloud DB)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Server Port
server.port=${PORT:8080}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
app.jwt.expiration-ms=86400000

# Spring Security - disable default user
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.com.habittrigger=DEBUG
logging.level.org.springframework.security=WARN
